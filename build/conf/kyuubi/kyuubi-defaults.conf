# ============================================================
# Kyuubi 1.9.1 —— Spark SQL Thrift/JDBC 服务（10009）
# 安装路径 /opt/kyuubi，由 build/scripts/run-kyuubi.sh 以 test_tenant 启动
#
# 兼容组合（见启动日志 /opt/kyuubi/RELEASE）：
#   Kyuubi 1.9.1 (built for Spark 3.5.1 / Scala 2.12 / Hadoop 3.3.6)
#   Spark 3.5.9（同 3.5.x 补丁线，Kyuubi 1.9.x 官方支持 Spark 3.5）
#   Hive 2.3.9（Spark 内置客户端 + /opt/hive 的 Metastore/beeline 同版本）
#
# 连接方式：
#   JDBC: jdbc:hive2://<host>:10009/test_db  用户 test_tenant，无密码（authentication=NONE）
#   REST: http://<host>:10099/api/v1/sessions（dataforge-server 元数据同步/执行策略使用）
# ============================================================

# ---------- 前端协议 / 端口 ----------
# THRIFT_BINARY: beeline / JDBC (10009)
# REST:          dataforge-server 的 KyuubiExecutionStrategy 走 /api/v1/sessions (10099)
# 两者是不同前端、不同端口：数据源 URL 里的 10009 只用于 JDBC，REST 必须走 10099，
# 否则 HTTP 打到 Thrift 端口会被直接断开（Unexpected end of file from server）。
kyuubi.frontend.protocols THRIFT_BINARY,REST
kyuubi.frontend.bind.host 0.0.0.0
kyuubi.frontend.bind.port 10009
kyuubi.frontend.rest.bind.host 0.0.0.0
kyuubi.frontend.rest.bind.port 10099

# REST 前端的会话/操作元数据（SQLite）。默认落在 $KYUUBI_HOME（/opt/kyuubi），
# 而该目录属主是 root、Kyuubi 以 test_tenant 运行，会因无法创建
# kyuubi_state_store.db 直接启动失败（Permission denied）。改到 df-data 卷上的可写目录，
# 容器重建后 REST 会话/批次元数据仍在；清理策略见 kyuubi.metadata.cleaner.*。
kyuubi.metadata.store.jdbc.url jdbc:sqlite:/opt/dataforge/kyuubi/state_store.db
# 演示环境：匿名（不校验账号密码）；生产应改为 KERBEROS/LDAP/PAM
kyuubi.authentication NONE

# ---------- 引擎生命周期 ----------
# USER 级共享：同一 OS 用户复用同一个 Spark 引擎，30 分钟无会话自动退出，避免 JVM 常驻
kyuubi.engine.share.level USER
kyuubi.session.engine.idle.timeout PT30M
kyuubi.session.engine.initialize.timeout PT5M
kyuubi.engine.spark.engine.single.spark.session true

# ---------- Spark 引擎默认参数（会透传给 spark-submit） ----------
spark.master local[2]
spark.driver.memory 1g
spark.driver.cores 1
spark.driver.maxResultSize 512m
spark.ui.enabled false

# Hive 元数据：走容器内 Hive Metastore 2.3.9（而不是本进程内嵌 Derby）
spark.sql.catalogImplementation hive
spark.hadoop.hive.metastore.uris thrift://127.0.0.1:9083
spark.hadoop.fs.defaultFS file:///
spark.sql.warehouse.dir file:///opt/dataforge/warehouse/tpcds

# 即席查询是只读场景：关闭 dataforge 的写入合规扩展与 SHS 事件日志，
# 避免 SELECT 被权限校验链路拦截，也避免每次查询都写事件日志。
spark.sql.extensions=
spark.sql.queryExecutionListeners=
spark.write.compliance.enabled false
spark.eventLog.enabled false
