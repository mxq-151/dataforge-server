[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:dataforge-init]
command=/opt/dataforge/scripts/init-dataforge.sh
priority=-100
autostart=true
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/var/log/dataforge/init.log

[program:yarn]
# 伪分布式 YARN（RM + NM，同一脚本内先起 RM 再起 NM，带就绪等待与优雅停止）
# YARN_ENABLED=false 时脚本正常退出，supervisord 记为 EXITED，不会反复重启。
# priority=2: 早于 DolphinScheduler(44)/dataforge-server(50)，让 DS 的 SPARK 任务可提交到 YARN。
command=/opt/dataforge/scripts/run-yarn.sh
environment=JAVA_HOME=/opt/java/openjdk,HADOOP_HOME=/opt/hadoop,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
priority=2
autostart=true
autorestart=unexpected
startsecs=0
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/yarn.log

[program:spark-shs]
# Spark History Server（18080）：作业结束后仍可查 executor 指标/配置（/api/runtime 的 history 源）
command=/opt/dataforge/scripts/run-spark-shs.sh
environment=JAVA_HOME=/opt/java/openjdk,SPARK_HOME=/opt/spark,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
priority=3
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/spark-shs.log

[program:hive-init]
# 幂等初始化 Hive Metastore 的 PostgreSQL schema（库 metastore，账号 hive/hive）
# priority=4: 在 postgres(1) 之后、hive-metastore(5) 之前；失败不阻塞其它服务，metastore 会自行等待
command=/opt/dataforge/scripts/init-hive.sh
environment=JAVA_HOME=/opt/java/openjdk,HIVE_HOME=/opt/hive,HIVE_CONF_DIR=/opt/hive/conf,HADOOP_HOME=/opt/hadoop,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
priority=4
autostart=true
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/var/log/dataforge/hive-init.log

[program:hive-metastore]
# Hive Metastore 2.3.9（Thrift 9083，PostgreSQL 元数据，warehouse=/opt/dataforge/warehouse/tpcds）
# 与 Spark 3.5.9 内置 Hive 客户端 2.3.9、/opt/hive 的 beeline 2.3.9 严格同版本
command=/opt/dataforge/scripts/run-hive-metastore.sh
environment=JAVA_HOME=/opt/java/openjdk,HIVE_HOME=/opt/hive,HIVE_CONF_DIR=/opt/hive/conf,HADOOP_HOME=/opt/hadoop,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
priority=5
autostart=true
autorestart=unexpected
startsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/hive-metastore.log

[program:hive-tables]
# 幂等注册 TPC-DS 25 张外表（已注册则跳过，不重复拉起 Spark）
# priority=6: 等 hive-metastore 就绪后执行
command=/opt/dataforge/scripts/init-hive-tables.sh
environment=JAVA_HOME=/opt/java/openjdk,SPARK_HOME=/opt/spark,HADOOP_HOME=/opt/hadoop,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
priority=6
autostart=true
autorestart=false
startsecs=0
startretries=0
redirect_stderr=true
stdout_logfile=/var/log/dataforge/hive-tables.log

[program:kyuubi]
# Apache Kyuubi 1.9.1（Spark SQL Thrift/JDBC 10009），USER 级引擎共享、30 分钟空闲回收
command=/opt/dataforge/scripts/run-kyuubi.sh
environment=JAVA_HOME=/opt/java/openjdk,KYUUBI_HOME=/opt/kyuubi,KYUUBI_CONF_DIR=/opt/kyuubi/conf,SPARK_HOME=/opt/spark,HADOOP_HOME=/opt/hadoop,HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop,YARN_CONF_DIR=/opt/hadoop/etc/hadoop
priority=7
autostart=true
autorestart=unexpected
startsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/kyuubi.log

[program:postgres]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf -c listen_addresses=*
user=postgres
priority=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/postgres.log

[program:marquez]
command=/bin/bash -c 'cd /opt/marquez && exec java -jar marquez-api-0.51.1.jar server marquez.dev.yml'
environment=JAVA_HOME=/opt/java/openjdk,MARQUEZ_CONFIG=/opt/marquez/marquez.dev.yml,MARQUEZ_PORT=5000,MARQUEZ_ADMIN_PORT=5001,POSTGRES_HOST=127.0.0.1,POSTGRES_PORT=5432,SEARCH_ENABLED=false
priority=42
autostart=true
autorestart=true
startsecs=15
redirect_stderr=true
stdout_logfile=/var/log/dataforge/marquez.log

[program:marquez-web]
command=/usr/sbin/nginx -g 'daemon off;'
priority=43
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/dataforge/marquez-web.log

[program:dolphinscheduler]
command=/opt/dataforge/scripts/run-ds-standalone.sh
environment=JAVA_HOME=/opt/java/openjdk,DOLPHINSCHEDULER_HOME=/opt/dolphinscheduler,SPARK_HOME=/opt/spark,SPRING_JACKSON_TIME_ZONE=Asia/Shanghai
priority=44
autostart=true
autorestart=true
startsecs=15
redirect_stderr=true
stdout_logfile=/var/log/dataforge/dolphinscheduler.log

[program:dataforge-server]
command=/opt/dataforge/scripts/run-dataforge.sh
# YARN_RM_URL / SPARK_SHS_URL 被 application.yml 的日志源与运行时源引用；
# YARN_ENABLED=false 时 run-dataforge.sh 会主动清空，避免源显示为可用却连不上。
environment=JAVA_HOME=/opt/java/openjdk,YARN_RM_URL=http://127.0.0.1:8088,SPARK_SHS_URL=http://127.0.0.1:18080,DS_URL=http://127.0.0.1:12345/dolphinscheduler
priority=50
autostart=true
autorestart=true
startsecs=15
redirect_stderr=true
stdout_logfile=/var/log/dataforge/dataforge-server.log