# dataforge All-in-One 运行编排(单容器)
# 先构建镜像: docker build --network=host -t dataforge-allinone:1.0 .
# 再启动:     docker compose up -d
name: dataforge-docker
services:
  dataforge:
    image: dataforge-allinone:1.0
    container_name: dataforge-allinone
    restart: unless-stopped
    ports:
      - "8082:8082"   # dataforge-server (http://localhost:8082/api)
      - "5432:5432"   # PostgreSQL
      - "12345:12345" # DolphinScheduler UI (http://localhost:12345/dolphinscheduler/ui)
      - "5000:5000"   # Marquez API (macOS 本机 5000 常被 AirPlay 占用,故映射 5001)
      - "5001:5001"   # Marquez API admin
      - "3000:3000"   # Marquez Web UI (http://localhost:3000)
      - "8088:8088"   # YARN ResourceManager UI / REST (http://localhost:8088)
      - "8042:8042"   # YARN NodeManager REST
      - "18080:18080" # Spark History Server (http://localhost:18080)
      - "9083:9083"   # Hive Metastore Thrift (Spark / beeline / Kyuubi 共用)
      - "10009:10009" # Kyuubi Thrift/JDBC (jdbc:hive2://localhost:10009/test_db)
      - "10099:10099" # Kyuubi REST API (dataforge-server 元数据同步/执行策略)
    # 说明：TPC-DS 数据已打进镜像（/opt/tpcds），首次启动由 entrypoint 播种到可写
    # warehouse（/opt/dataforge/warehouse/tpcds，df-data 卷），因此不再绑定宿主机目录。
    # 宿主机 /Users/mxq/Desktop/tpcds 仅作为构建期 staging 源，容器运行不依赖它。
    # PostgreSQL 与 /opt/dataforge 默认仍写容器内，需要持久化时叠加
    # docker-compose.persist.yml（命名卷 df-pgdata / df-data）。
    mem_limit: 8g