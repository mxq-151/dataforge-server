# ============================================================
# 任务智能诊断 —— 引擎验证环境（可选，独立编排）
#
# 设计原则：
#   * 不进入 dataforge-allinone 主镜像；主镜像体积与启动行为不变（仅在 pom 补了
#     ClickHouse JDBC 驱动，属于服务端能力，不是引擎服务）。
#   * 复用主编排的 Docker 网络 dataforge-docker_default，引擎可用服务名
#     （clickhouse / kafka / pulsar / hbase / doris / starrocks）被主容器访问。
#   * 用 profiles 分组，避免一次性占满 Docker VM（本机实测 12.48 GiB）：
#       lite            → clickhouse + kafka + pulsar + hbase（约 3.5 GiB）
#       olap-doris      → doris all-in-one（约 4 GiB，与 olap-starrocks 互斥）
#       olap-starrocks  → starrocks all-in-one（约 3 GiB）
#       flink           → Flink 2.2.0 JM + TM（复用已有 dataforge-flink:2.2.0）
#   * 端口/账号/密码全部走环境变量（startup/engines/.env.engines），不硬编码。
#   * 每个服务都有 healthcheck：健康 ≠ dataforge 能连，连通性由
#     startup/engines/verify-engines.sh 单独验证。
#
# 用法见 startup/engines/README 段落（start-lite.sh / start-olap.sh / verify-engines.sh）。
# ============================================================
name: dataforge-docker

networks:
  default:
    name: dataforge-docker_default
    external: true

volumes:
  df-ch-data:
  df-kafka-data:
  df-pulsar-data:
  df-hbase-data:
  df-doris-fe-meta:
  df-doris-be-storage:

services:
  # ---------------- ClickHouse 24.8（单节点，arm64 原生） ----------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: df-clickhouse
    profiles: ["lite"]
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP / JDBC(http)
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"    # Native TCP
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-dwd}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dataforge}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - df-ch-data:/var/lib/clickhouse
      - ../engines/init/clickhouse:/docker-entrypoint-initdb.d:ro
      - ../engines/init/clickhouse-config/00-memory.xml:/etc/clickhouse-server/config.d/00-memory.xml:ro
      # 日志目录共享给主容器（诊断 file 通道）
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/clickhouse:/var/log/clickhouse-server
    # 1 GiB 的依据：旧上限 768 MiB 时实测常驻 767.9 MiB，正好贴顶——其中大部分是
    # MergeTree 的 page cache / mark cache，贴顶会触发持续淘汰，查询抖动甚至 OOMKill。
    # 1 GiB 容器内再通过 config.d 把 max_server_memory_usage_to_ram_ratio 限到 0.8
    # （≈819 MiB），剩余约 200 MiB 留给进程栈、jemalloc 元数据与 glibc 开销。
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------- Kafka 3.9.0（KRaft 单 broker） ----------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: df-kafka
    profiles: ["lite"]
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      # 宿主/本地客户端走 localhost:9092；同一 Docker 网络内的容器走 kafka:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - df-kafka-data:/var/lib/kafka/data
      # apache/kafka 镜像默认就在 /opt/kafka/logs 写 server.log / controller.log 等文件
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/kafka:/opt/kafka/logs
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---------------- Pulsar 3.3.4（standalone） ----------------
  pulsar:
    image: apachepulsar/pulsar:3.3.4
    container_name: df-pulsar
    profiles: ["lite"]
    restart: unless-stopped
    command: bin/pulsar standalone
    ports:
      - "${PULSAR_PORT:-6650}:6650"       # binary
      - "${PULSAR_HTTP_PORT:-8080}:8080"  # admin / web
    environment:
      PULSAR_MEM: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m"
      # 默认 appender 是 Console，日志只进 docker logs；改成 RollingFile 才会落
      # /pulsar/logs/pulsar.log，供诊断 file 通道读取（PULSAR_LOG_APPENDER 由 bin/pulsar 直接映射为 -D）。
      PULSAR_LOG_APPENDER: RollingFile
      PULSAR_LOG_FILE: pulsar.log
    volumes:
      - df-pulsar-data:/pulsar/data
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/pulsar:/pulsar/logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/admin/v2/brokers/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ---------------- HBase 2.6.5（standalone，内嵌 ZK + Master + RS） ----------------
  # 复用本机已有镜像；JDK 11 运行，客户端为 hbase-client 2.5.9（2.x RPC 兼容）。
  # hostname 固定为 hbase：Master 会把自身 hostname 注册到 ZK，必须让主容器可解析。
  hbase:
    image: openeuler/hbase:2.6.5-oe2403sp3
    container_name: df-hbase
    profiles: ["lite"]
    restart: unless-stopped
    hostname: hbase
    entrypoint: ["/bin/bash", "-lc"]
    # start-hbase.sh 在 standalone(distributed=false) 下把 ZK/Master/RS 起在同一 JVM；
    # 前台 tail 日志保持容器存活。
    command:
      - "/usr/local/hbase/bin/start-hbase.sh && exec tail -F /usr/local/hbase/logs/*.log"
    ports:
      - "${HBASE_ZK_PORT:-2181}:2181"
      - "${HBASE_MASTER_UI_PORT:-16010}:16010"
      - "${HBASE_RS_UI_PORT:-16030}:16030"
    volumes:
      - ../engines/init/hbase/hbase-site.xml:/usr/local/hbase/conf/hbase-site.xml:ro
      - df-hbase-data:/hbase-data
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/hbase:/usr/local/hbase/logs
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "echo 'list' | /usr/local/hbase/bin/hbase shell -n >/dev/null 2>&1"]
      interval: 20s
      timeout: 25s
      retries: 30
      start_period: 60s

  # ---------------- Apache Doris 4.1.5（FE + BE 两个容器，arm64 原生） ----------------
  # 端口：8030 FE HTTP、9030 FE MySQL 协议、8040 BE HTTP。
  # 不用 all-in-one 镜像的 all 角色：该角色把 FE/BE 都绑在容器回环地址上，
  # BE 注册成 127.0.0.1，跨容器（dataforge-server）无法建表/写入表数据。
  # 这里 FE 先引导建集群，BE 再注册到 FE，BE 用容器 IP 注册，主服务可直连。
  doris-fe:
    image: apache/doris:all-in-one-4.1.5
    container_name: df-doris-fe
    profiles: ["olap-doris"]
    restart: unless-stopped
    hostname: doris-fe
    ports:
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${DORIS_FE_MYSQL_PORT:-9030}:9030"
    environment:
      DORIS_ROLE: fe
      DEPLOY_MODE: local
      # 1.5 GiB 堆：单 FE、单库、元数据量很小；Doris 默认 8g 是生产多 FE 口径。
      # 容器 2 GiB = 1.5 GiB 堆 + 约 0.5 GiB 给 metaspace/code cache/线程栈/native。
      FE_HEAP: "${DORIS_FE_HEAP:-1536m}"
      START_TIMEOUT: "180"
      # 单 BE => 默认单副本，省掉每条 CREATE TABLE 手写 replication_num
      # enable_fqdn_mode：容器重启后 IP 会变，Doris 默认把节点 IP 写进元数据，
      # IP 变化会导致 FE 选主卡在 UNKNOWN；FQDN 模式用 hostname 注册，重启后仍可恢复。
      FE_CONFIG_EXTRA: |
        force_olap_table_replication_num = 1
        disable_balance = true
        enable_fqdn_mode = true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - df-doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/doris-fe:/opt/apache-doris/fe/log
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9030'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s

  doris-be:
    image: apache/doris:all-in-one-4.1.5
    container_name: df-doris-be
    profiles: ["olap-doris"]
    restart: unless-stopped
    hostname: doris-be
    ports:
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
    environment:
      DORIS_ROLE: be
      DEPLOY_MODE: local
      FE_MASTER: doris-fe
      # BE 主体是 C++（存储/压缩/向量化执行都用堆外），BE_HEAP 只服务 BE 内置 JVM（UDF），
      # 512 MiB 足够；容器 3 GiB 里其余约 2.5 GiB 留给 page cache 与 compaction 缓冲。
      BE_HEAP: "${DORIS_BE_HEAP:-512m}"
      # 镜像默认 be.conf 里 mem_limit=40%（3 GiB 容器下只有 1.2 GiB），
      # 而 BE 空载 RSS 已约 1.6 GiB，任何一次分配都会被内存回收器拒绝
      #（MEM_ALLOC_FAILED，insert 直接失败）。调到 75% => 2.25 GiB，
      # 余下 0.75 GiB 给 glibc/jemalloc 元数据与未被 tracker 统计的部分。
      BE_CONFIG_EXTRA: "mem_limit = 75%"
      START_TIMEOUT: "180"
    depends_on:
      doris-fe:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - df-doris-be-storage:/opt/apache-doris/be/storage
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/doris-be:/opt/apache-doris/be/log
    # 3 GiB：BE 是 C++ 进程，堆外（page cache + compaction + 向量化缓冲）是主要开销，
    # Doris 单机验证写入量很小，3 GiB 足够且与 FE 合计 5 GiB，符合总预算。
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9050'"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s

  # ---------------- StarRocks：未部署（镜像不可得） ----------------
  # starrocks/allin1-ubuntu:3.3.5 在当前网络下不可拉取（Docker Hub 直连不可达，
  # 可用镜像源均返回 unavailable / layer 校验失败），故不纳入本编排。
  # 仅保留配置与连接串层面的静态说明，见 startup/engines/.env.engines.example
  # 与 verify-engines.sh 的 static 分支；到达可联网环境后按同样方式补服务即可。

  # ---------------- Flink 2.2.0（JM + TM，复用已有镜像） ----------------
  # 主服务通过 FLINK_REST_URL=http://flink-jobmanager:8081 接入日志/运行时指标源。
  flink-jobmanager:
    image: dataforge-flink:2.2.0
    container_name: flink-jobmanager
    profiles: ["flink"]
    restart: unless-stopped
    command: jobmanager
    ports:
      - "${FLINK_JM_PORT:-8081}:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      # JM 日志目录共享给主容器（logs.sources[flink].jobmanager-log-dirs）
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/flink/jobmanager:/opt/flink/log
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/overview >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  flink-taskmanager:
    image: dataforge-flink:2.2.0
    container_name: flink-taskmanager
    profiles: ["flink"]
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
    volumes:
      # TM 日志目录共享给主容器（logs.sources[flink].taskmanager-log-dirs）
      - ${DATAFORGE_LOG_ROOT:-/Users/mxq/dataforge-logs}/flink/taskmanager:/opt/flink/log
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "test -d /opt/flink && pgrep -f TaskManagerRunner >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
