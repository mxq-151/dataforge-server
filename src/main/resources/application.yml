server:
  port: 8083
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: dataforge
  messages:
    encoding: UTF-8
    basename: i18n/messages
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dataforge?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 300000
  sql:
    init:
      mode: never
      # schema-locations: classpath:sql/init-complete.sql  # 首次部署时手动执行一次即可
      # 注意：mode=always 会导致每次启动都 DROP 并重建表，丢失所有数据！

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bigdata.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: dataforge-server-jwt-secret-key-2024-very-long-secret
  expiration: 86400000
  header: Authorization
  prefix: Bearer

aes:
  key: Bigdata2026AesK@

# 数据资源权限校验接口（POST /system/permission/check）的共享密钥。
# 该接口由执行引擎（Spark 作业）在无登录态的情况下回调，改用请求头 X-Permission-Check-Token 鉴权；
# Spark 侧需配置同一值（write.compliance.permission.check.token）。
# 留空则接口拒绝一切调用；生产环境请按环境覆盖（如环境变量 PERMISSION_CHECK_SECRET）。
permission:
  check:
    secret: dataforge-permission-check-2026-shared-secret

engine:
  spark:
    home: /Users/mxq/Desktop/bigdata-workspace/spark-4.1.1-bin-hadoop3
  # Kyuubi REST 前端地址：与 JDBC/Thrift 端口（默认 10009）不同，Kyuubi REST 默认 10099。
  # 留空时沿用旧逻辑（把数据源 URL 的 host:port 直接当 REST 地址），仅适用于 URL 填 http(s) 的部署。
  # 容器内由 build/scripts/run-dataforge.sh 注入 http://127.0.0.1:10099。
  kyuubi:
    rest-base-url: ${KYUUBI_REST_BASE_URL:}
  flink:
    home: /opt/flink
  jar:
    base-path: /Users/mxq/jars/

# 调度系统（DolphinScheduler）只读接入。
# 两处共用本组配置：
#   1) /asset/table/{id}/producers —— 按表名实时反查产出工作流；
#   2) 调度运行指标采集（SchedulerTaskMetricsCollectTask，每日 03:30）—— 支撑
#      「资产概况」的 TOP 任务与任务延迟率看板。
# base-url 为空表示未接入：产出任务返回空列表、运行指标采集静默跳过，均不报错。
scheduler:
  dolphinscheduler:
    # all-in-one 容器由 supervisord 注入 DS_URL=http://127.0.0.1:12345/dolphinscheduler
    # 与 DS_TOKEN（DS standalone 的访问令牌，由 build/sql/dolphinscheduler-init-data.sql 播种）
    base-url: ${DS_URL:}
    token: ${DS_TOKEN:}
    default-project-code: '1'

# 质检告警投递配置（alert.webhook.url）已随「告警订阅」页签与告警链路一并删除
# （2026-10-09）：DqAlertSender / dq_alert_log / dq_alert_subscription 均不再存在。

# 数据集成（Data Integration）集群连接配置。
# 任务统一提交为 Flink CDC 作业（clusterType 仅保留 flink-standalone → Flink sql-client.sh）。
# 提交 / 取消 / 状态查询全部通过命令行执行：可执行文件路径、启动参数、工作目录都在这里配置，
# 代码中没有硬编码路径；home 留空且未显式配置 bin 时，上线会返回明确的「未配置」错误。
# 参数模板占位符：提交 {sqlFile}、取消/状态 {jobId}。
integration:
  flink:
    # Flink 安装目录，如 /opt/flink；用于推导 bin/sql-client.sh、bin/flink 与默认工作目录 {home}/tmp
    home: ''
    # 提交用可执行文件；留空取 {home}/bin/sql-client.sh
    submit-bin: ''
    # 取消 / 状态查询用可执行文件；留空取 {home}/bin/flink
    manage-bin: ''
    # 生成的 .sql 落盘目录；留空取 {home}/tmp 或系统临时目录
    work-dir: ''
    # 提交参数模板（可覆盖）；留空且使用 sql-client 时默认 -f {sqlFile}
    submit-args: []
    # 取消参数模板；默认 cancel，末尾会自动补 jobId
    cancel-args: ['cancel']
    # 状态查询参数模板；默认 list -r（列出运行中的作业）
    status-args: ['list', '-r']
    # sql-client 提交目标的 execution.target，远端集群用 remote
    execution-target: remote
    # JobManager REST 地址，用于推导 sql-client 的 -Drest.address/port 与 flink 的 -m host:port
    rest-url: http://127.0.0.1:8081
    default-parallelism: 1
    # checkpoint 间隔（毫秒），仅流模式生效；<=0 关闭
    checkpoint-interval: 30000
    # 数据集成要求的最低 Flink 版本；低于该版本（如 1.x / 2.1）拒绝提交
    min-version: 2.2.0
    # 数据血缘：随作业 SQL 下发 OpenLineage 作业状态监听器配置（Flink 2.x 原生血缘接口）。
    # openlineage-flink jar 需放入 {home}/lib（或通过 jar 显式指定），缺失时提交直接失败。
    lineage:
      enabled: true
      jar: ''
      # OpenLineage / Marquez 上报地址（容器内 Marquez API 为 5000）
      transport-url: http://127.0.0.1:5000
    # 取消 / 状态查询命令超时
    timeout-ms: 30000
    # 提交命令超时
    submit-timeout-ms: 120000


# ============================================================================
# 统一取数（/api/telemetry/v1/**）
#
# 服务类型只收敛到 agentkit 的九个引擎；file 是 transport，ds/yarn 是接入方式，
# 都不作为可诊断引擎。ds 只提供 ds.worker 任务日志（log.task），
# os.cpu/os.memory/os.disk/log.slow_query 为声明未实现，
# 查询会返回 NOT_IMPLEMENTED 且 data 恒为 null。
# ============================================================================
telemetry:

  # ---------------------------------------------------------------------------
  # 取数 v1 接口（/api/telemetry/v1/**）的存储后端与路由。
  # 未配置任何实例时，查询返回 UNAVAILABLE + NOT_CONFIGURED，绝不返回空数组冒充数据。
  # 示例（按需取消注释）：
  #
  # backends:
  #   prometheus:
  #     - id: prometheus-prod
  #       base-url: http://prometheus:9090
  #       path-prefix: /api/v1
  #       auth: { type: none }
  #       limits: { max-series: 5000, max-points-per-series: 11000, timeout-ms: 15000 }
  #       # metadata/query scope=metrics 的发现范围；默认 kafka/yarn/spark。
  #       # Spark 由 SHS 的 jmx_exporter 暴露、VM 抓取后即可发现。
  #       discovery-service-types: [kafka, yarn, spark]
  #       # 当 /api/v1/metadata 为空时，从抓取文本的 # TYPE / # HELP / # UNIT 补类型与单位。
  #       metric-metadata-urls: []
  #   victoriametrics:
  #     - id: vm-prod
  #       base-url: http://vm:8428
  #       path-prefix: /api/v1   # VM 也支持 /prometheus/api/v1，但代码按 <prefix>/label 拼接
  #       query: { partial-response: false, max-points-per-timeseries: 11000 }
  #       discovery-service-types: [kafka, yarn, spark]
  #       # 实测 VM 1.106 的 /api/v1/metadata 为空；Kafka/YARN/Spark 的类型需从 exporter 文本补全：
  #       # metric-metadata-urls:
  #       #   - 'http://kafka:7071/metrics'
  #       #   - 'http://yarn-exporter:18090/metrics'
  #       #   - 'http://dataforge-allinone:18083/metrics'
  #   local-disk:
  #     - id: local-disk
  #       allow-root-dirs: ['/var/log', '/data/logs']
  #       sources:
  #         - service-type: flink
  #           component-id: flink.taskmanager
  #           host-id: 10.0.0.12
  #           stream: stdout
  #           path: /var/log/flink/flink-taskmanager-10.0.0.12.out
  #           timestamp-pattern: 'yyyy-MM-dd HH:mm:ss.SSS'
  #       limits: { max-lines: 2000, max-bytes: 262144, max-scan-bytes: 67108864, timeout-ms: 20000 }
  #   elasticsearch:
  #     - id: es-logs
  #       urls: ['http://es:9200']
  #       index: dataforge-logs-*
  #       auth: { type: basic, username: elastic, password-ref: 'env:ES_PASSWORD' }
  #   flink-rest:
  #     - id: flink-rest
  #       base-url: http://flink-jobmanager:8081
  #       # 同时作为 metadata/query scope=version|config 的通道：
  #       # version 读 /overview.flink-version；config 的 flink section 读 /jobmanager/config，
  #       # resources section 读 /overview + /taskmanagers 的 CPU/内存分配，
  #       # job section（需 ref.jobId）读 /jobs/{jobId} 与 /jobs/{jobId}/config。
  #       limits: { timeout-ms: 10000, max-response-bytes: 8388608, max-series: 2000 }
  #       # 异常摘要只走 GET /jobs/{jobId}/exceptions；2.2 无单条异常子资源。
  #       max-exceptions: 20            # 异常条数上限（Flink 服务端默认也是 20）
  #       max-concurrent-exceptions: 20 # 每条根异常保留的并发异常数
  #       max-stack-trace-chars: 20000  # 单条 stacktrace 输出字符上限，超出客户端截断并标记
  #   # Spark SHS REST：只承载完成态 instant 快照（application attempts、stage shuffle/spill、
  #   # taskSummary 分位、executor 内存/GC/shuffle）。不是时间序列，range / rate 会被拒绝；
  #   # 作业配置走 metadata/query scope=config 的 spark-shs provider，不再有独立 config 端点。
  #   spark-shs-rest:
  #     - id: spark-shs-rest
  #       base-url: http://spark-history:18080
  #       mode: history   # history | live
  #       limits: { timeout-ms: 10000, max-response-bytes: 8388608, max-series: 2000 }
  #   # YARN 容器日志：只承载 log.task；服务日志（log.service）不会路由到这里。
  #   # 已聚合走 yarn logs；聚合未完成（如应用仍在跑）回退 NM 本地目录，需要把 NM 日志目录挂载到
  #   # node-log-root 才能读到；未挂盘的容器在聚合完成前不可获取（响应里会给原因）。
  #   yarn:
  #     - id: yarn
  #       rm-base-url: http://yarn-rm:8088   # 只给 ref.jobName 或需要 node-local 回退时必填
  #       command: yarn                       # yarn 可执行文件或绝对路径
  #       # 本进程可见的 NM 容器日志根目录；与 compose 中
  #       # ${DATAFORGE_LOG_ROOT}/yarn-nm-logs:/var/lib/dataforge-yarn/nm-logs 的宿主机一侧对应
  #       node-log-root: /Users/mxq/dataforge-logs/yarn-nm-logs
  #       nm-base-url: http://127.0.0.1:8042  # 单节点/端口映射时可覆盖 NM REST 地址；留空按 RM nodeHTTPAddress
  #       limits: { timeout-ms: 30000, max-bytes: 1048576, max-concurrent: 2, acquire-timeout-ms: 2000, max-nodes: 50 }
  #   # DolphinScheduler 任务日志：只承载 log.task；ref 用 jobId（即 taskInstanceId）或
  #   # jobName（不全局唯一，命中多条时必须给 workflowInstanceId 消歧，否则返回 AMBIGUOUS_REFERENCE）。
  #   ds-api:
  #     - id: ds-api
  #       base-url: http://dolphinscheduler:12345/dolphinscheduler
  #       # DS 访问令牌（t_ds_access_token.token）：请求头 token 认证，不登录、不维护 session；
  #       # 生产用 token-ref 引用环境变量，避免明文写在 yml 里。
  #       token-ref: 'env:DS_TOKEN'
  #       project-codes: []   # 留空时遍历该令牌可见的项目
  #       limits: { timeout-ms: 10000, max-bytes: 1048576, max-lines: 5000, page-size: 1000, max-pages: 20 }
  #   # Doris 慢查询：只承载 log.service 的 slowquery。走固定只读 SQL 查询
  #   # __internal_schema.audit_log（需 FE enable_audit_plugin=true），没有任意 SQL 入口。
  #   # 表不存在时按目录声明回退到 local-disk 解析 FE 的 fe.audit.log。
  #   doris-audit:
  #     - id: doris-audit
  #       jdbc-url: jdbc:mysql://doris-fe:9030/__internal_schema
  #       username: root
  #       password-ref: 'env:DORIS_PASSWORD'
  #       slow-query-ms: 5000          # audit_log.query_time 阈值；Doris qe_slow_log_ms 默认 5000
  #       zone: UTC                    # audit_log.time 所在时区，必须与 FE 进程时区一致
  #       default-lookback-hours: 24   # 请求未带时间范围时的回看窗口，避免全表扫描
  #       limits: { timeout-ms: 10000, max-rows: 500, max-bytes: 524288 }
  #   # 退路：FE 的 fe.audit.log 由 local-disk 解析。把下面这条加到上面的 local-disk.sources，
  #   # 并把 fe.audit.log 所在目录加入 allow-root-dirs。local-disk 的时间戳取行首 'AuditLogger '
  #   # 后的写入时间（与行内 Timestamp= 查询开始时间可能差数秒）；阈值需按 Time(ms)= 自行过滤。
  #   # sources:
  #   #   - service-type: doris
  #   #     component-id: doris.fe
  #   #     host-id: cluster
  #   #     stream: slowquery
  #   #     path: /Users/mxq/dataforge-logs/doris-fe/fe.audit.log
  #   #     timestamp-pattern: "'AuditLogger 'yyyy-MM-dd HH:mm:ss,SSS"
  #   #     zone: UTC   # 与 FE 进程时区一致
  #
  # routing:
  #   metric:
  #     default-order: [prometheus-prod, vm-prod, flink-rest, spark-shs-rest]
  #     rules:
  #       - service-type: flink
  #         metric: 'flink_checkpoint_*'
  #         order: [flink-rest]
  #   log:
  #     default-order: [local-disk, es-logs]
  #   circuit: { failure-threshold: 5, open-ms: 30000 }
  #   # 只有在此显式声明的后端才允许互相回退；Prometheus 与 VictoriaMetrics 默认不等价。
  #   equivalence-groups:
  #     flink-logs:
  #       backends: [local-disk, es-logs]
  #       service-type: flink
  #     doris-slowquery:
  #       backends: [doris-audit, local-disk]
  #       service-type: doris
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 服务版本与配置查询（POST /telemetry/v1/metadata/query）。
  # scope=version|config|both|metrics；metrics 为运行时指标名发现：
  #   - Prometheus / VictoriaMetrics：/api/v1/label/__name__/values（match[] 按 service_type 过滤）
  #   - Flink：/jobmanager/metrics、/taskmanagers/{id}/metrics；job/vertex 级需 ref.jobId/ref.vertexId
  #   - ClickHouse：system.metrics / system.events / system.asynchronous_metrics
  #   - Doris：FE/BE 的 GET /metrics
  #   - Spark SHS：进程 JVM 指标由 jmx_exporter + VM 抓取；完成态指标走 spark-shs-rest 手工语义；
  #     metadata scope=targets 读 /api/v1/applications，scope=config 读 environment
  # 默认全部关闭；未启用的 provider 不参与路由，查询返回 UNAVAILABLE + NOT_CONFIGURED。
  # 密码统一走 password-ref（env: / file: / config: / plain:），不要明文写在 yml 里。
  # Doris / StarRocks 走独立 JDBC 连接池（上限 2、connectTimeout/socketTimeout），
  # 不复用应用 DataSource，且只允许 SHOW FRONTENDS / SHOW BACKENDS /
  # ADMIN SHOW FRONTEND CONFIG 等只读语句。
  # 示例（按需取消注释）：
  #
  # metadata:
  #   query: { max-targets: 20, max-config-items: 500, max-metrics: 5000, timeout-ms: 10000 }
  #   providers:
  #     ambari:
  #       enabled: false
  #       order: 10
  #       base-url: http://ambari:8080
  #       cluster: c1
  #       auth: { type: basic, username: admin, password-ref: 'env:AMBARI_PASSWORD' }
  #     clickhouse-http:
  #       enabled: false
  #       order: 20
  #       base-url: http://127.0.0.1:8123
  #       auth: { type: basic, username: default, password-ref: 'env:CLICKHOUSE_PASSWORD' }
  #       sections: [server_settings, settings, merge_tree_settings]
  #       # scope=metrics 走 system.metrics / system.events / system.asynchronous_metrics，
  #       # 只列名字与类型；ClickHouse 没有指标查询后端，metrics/query 仍返回 NOT_IMPLEMENTED。
  #     doris-fe:
  #       enabled: false
  #       order: 30
  #       jdbc-url: jdbc:mysql://127.0.0.1:9030
  #       username: root
  #       password-ref: 'env:DORIS_PASSWORD'
  #       # scope=metrics 走 FE/BE 的 Prometheus 文本端点；Doris 没有系统表指标目录。
  #       fe-metrics-url: http://127.0.0.1:8030/metrics
  #       be-metrics-url: http://127.0.0.1:8040/metrics
  #     # Spark SHS 配置：读取 /api/v1/applications/{applicationId}/environment，
  #     # 作为 metadata/query scope=config 的通道；同时用 /api/v1/applications
  #     # 提供 scope=targets 的作业清单。ref.applicationId 在 config 查询时必填。
  #     # version 取应用详情 attempts[].appSparkVersion（SHS 原值，不猜、不补）。
  #     spark-shs:
  #       enabled: false
  #       order: 30
  #       base-url: http://spark-history:18080
  #       # auth: { type: basic, username: spark, password-ref: 'env:SPARK_SHS_PASSWORD' }
  #     starrocks-fe:            # 未对真实实例验证
  #       enabled: false
  #       order: 40
  #       jdbc-url: jdbc:mysql://127.0.0.1:9030
  #       username: root
  #       password-ref: 'env:STARROCKS_PASSWORD'
  #     manual:
  #       enabled: false
  #       order: 90
  #       entries:
  #         - service-type: clickhouse
  #           component-id: clickhouse.server
  #           host-id: ch-1
  #           raw-version: 24.8.14.39
  #           vendor: ClickHouse
  #           distribution: clickhouse-server
  #           configs:
  #             - { section: server_settings, key: max_connections, value: '4096' }
  # ---------------------------------------------------------------------------
