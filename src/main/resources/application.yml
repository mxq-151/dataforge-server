server:
  port: 8082
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: dataforge
  messages:
    encoding: UTF-8
    basename: i18n/messages
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dataforge?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: '123456'
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  sql:
    init:
      mode: never
      # schema-locations: classpath:sql/init-complete.sql  # 首次部署时手动执行一次即可
      # 注意：mode=always 会导致每次启动都 DROP 并重建表，丢失所有数据！

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bigdata.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: bigdata-platform-jwt-secret-key-2024-very-long-secret
  expiration: 86400000
  header: Authorization
  prefix: Bearer

aes:
  key: Bigdata2026AesK@

engine:
  spark:
    home: /Users/mxq/Desktop/bigdata-workspace/spark-4.1.1-bin-hadoop3
  flink:
    home: /opt/flink
  jar:
    base-path: /opt/jars
